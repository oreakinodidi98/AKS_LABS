apiVersion: apps/v1
kind: Deployment
metadata:
  name: mychatbot
  labels:
    app: mychatbot
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mychatbot
      azure.workload.identity/use: "true"
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  minReadySeconds: 5
  template:
    metadata:
      labels:
        app: mychatbot
        azure.workload.identity/use: "true"
        prometheus.io/scrape: "true"
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: mychatbot
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: mychatbot
      nodeSelector:
        "kubernetes.io/os": linux
      containers:
      - name: mychatbot
        image: oreacrregistry.azurecr.io/chatbot:v1
        imagePullPolicy: Always
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        ports:
        - containerPort: 8080
        # The streamable-http endpoint requires MCP protocol headers, so probes use a TCP check instead of an HTTP GET.
        livenessProbe:
          tcpSocket:
            port: 8080
          failureThreshold: 12
          periodSeconds: 5
          timeoutSeconds: 5
        readinessProbe:
          tcpSocket:
            port: 8080
          failureThreshold: 12
          periodSeconds: 5
          timeoutSeconds: 5
        startupProbe:
          tcpSocket:
            port: 8080
          failureThreshold: 20
          periodSeconds: 5
          timeoutSeconds: 5
        env:
        - name: TITLE
          value: "My Chatbot"
        - name: AGENT_INSTRUCTIONS
          value: "You are a helpful assistant reachable through the Model Context Protocol."
        - name: TEMPERATURE
          value: "0.5"
        - name: MODEL_ENDPOINT
          value: "https://ore-mcp-foundry.services.ai.azure.com/models"
        - name: MODEL_DEPLOYMENT
          value: "gpt-5.4-mini"