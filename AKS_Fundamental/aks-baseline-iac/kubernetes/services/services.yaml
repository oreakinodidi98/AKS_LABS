apiVersion: v1
kind: Service
metadata:
  name: webapi-service
  namespace: applications
  labels:
    app: webapi
spec:
  type: ClusterIP
  selector:
    app: webapi
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-service
  namespace: applications
  labels:
    app: webapp
spec:
  type: ClusterIP
  selector:
    app: webapp
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 8080
